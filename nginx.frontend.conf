# Configuración de nginx para servir una SPA de React (Vite build).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Si el archivo/ruta pedida no existe físicamente (por
        # ejemplo "/solicitudes" al recargar la página), en vez de
        # devolver un 404, sirve siempre index.html — así React
        # Router puede tomar el control y mostrar la ruta correcta.
        try_files $uri $uri/ /index.html;
    }
}
